    <main>
        <div class="caixa">
			<div class="texto">
			<h2>Deixe a sua avaliação</h2>
				<div class="mb-3">
					<label for="nome" class="form-label">Nome:</label>
					<input type="text" class="form-control" id="nome"
						   placeholder="Digite seu nome" required>
				</div>
				<div class="mb-3">
					<label for="email" class="form-label">Email:</label>
					<input type="email" class="form-control" id="email"
						   placeholder="name@example.com" required>
				</div>
				<div class="mb-3">
					<label class="form-label">Nota:</label>
					<select class="form-select" id="nota" required>
						<option value="" selected disabled>Avalie de 1 a 5</option>
						<option value="1">1</option>
						<option value="2">2</option>
						<option value="3">3</option>
						<option value="4">4</option>
						<option value="5">5</option>
					</select>
				</div>
				<div class="mb-3">
					<label for="avaliacao" class="form-label">
						Sua avaliação (opcional)
					</label>
					<textarea class="form-control" id="avaliacao"
							  rows="3" placeholder="Escreva sua opinião..."></textarea>
				</div>
				<button type="button" class="btn btn-primary"
						onclick="enviarAvaliacao()">
					Enviar avaliação
				</button>
				<p id="mensagem" class="mt-3"></p>
		</div>
	</div>
    </main>
    <a href="#" class="botao-topo" aria-label="Voltar ao topo">
        <i class="bi bi-arrow-up-circle-fill"></i>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	<script>
    function enviarAvaliacao() {

        let nome = document.getElementById("nome").value;
        let email = document.getElementById("email").value;
        let nota = document.getElementById("nota").value;
        let avaliacao = document.getElementById("avaliacao").value;

        if (nome.trim() === "") {
            alert("Digite seu nome!");
            return;
        }

        if (email.trim() === "") {
            alert("Digite seu email!");
            return;
        }

        if (!document.getElementById("email").checkValidity()) {
            alert("Digite um email válido!");
            return;
        }

        if (nota === "") {
            alert("Selecione uma nota!");
            return;
        }

        alert("Obrigado, " + nome + "! Sua avaliação foi enviada com sucesso!");

        document.getElementById("nome").value = "";
        document.getElementById("email").value = "";
        document.getElementById("nota").value = "";
        document.getElementById("avaliacao").value = "";
    }
	</script>
</body>
